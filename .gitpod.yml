tasks:
  - name: llm-setup
    before: |
      docker pull ollama/ollama
      docker rm -f ollama 2>/dev/null || true
      docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
    init: |
      until docker exec ollama ollama list >/dev/null 2>&1; do sleep 2; done
      docker exec ollama ollama pull tinyllama
  - name: player-service-app setup
    dependsOn:
      - llm-setup
    init: |
      cd player-service-app
      python3 -m venv .venv
      .venv/bin/pip install -r requirements.txt
      .venv/bin/pytest
  - name: player-service-model setup
    before: |
      cd player-service-model
      docker build -t a4a_model .
    init: docker run -d -p 5000:5000 a4a_model


ports:
  - port: 5000
    onOpen: open-preview
  - port: 8000
    onOpen: open-preview
